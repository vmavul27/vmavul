[project]
name = "vmavul"
version = "1.0.0"
description = "VMAVul: synthesizing vulnerabilities with a Vulnerability Manifestation Atlas"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "lizard==1.23.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# UniXcoder embeddings (diversity check) and the downstream detectors
ml = [
  "torch>=2.4",
  "transformers>=4.56",
  "peft>=0.17",
  "safetensors>=0.4",
  "accelerate>=1.0",
]

[project.scripts]
vmavul = "vmavul.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
